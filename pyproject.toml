[build-system]
requires = ["setuptools>=77.0.3,<81.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-tt-plugin"
dynamic = ["version"]
description = "Tenstorrent backend plugin for vLLM"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
# The prepared environment owns the runtime stack; see README.md#dependency-ownership.
dependencies = ["PyYAML", "regex"]

[project.optional-dependencies]
# Offline Qwen-VL example support.
examples = ["qwen-vl-utils"]
# Tool pins and their rationale: AGENTS.md sections 3 and 4.
dev = ["pre-commit", "ruff==0.14.0", "pytest>=8,<9"]

[project.entry-points."vllm.general_plugins"]
tt_model_registry = "vllm_tt_plugin.entrypoints:register"

[project.entry-points."vllm.platform_plugins"]
tt = "vllm_tt_plugin.entrypoints:platform_plugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vllm_tt_plugin*"]

# Versions use ``MAJOR.MINOR.PATCH``. Major and minor follow the targeted vLLM
# series; patch counts plugin releases independently, starting at zero for each
# new series. For example, ``0.31.2`` is the third plugin release targeting vLLM
# 0.31, regardless of vLLM's patch number. The exact vLLM build is pinned in
# ``docs/install-vllm-tt.sh``; a shared series does not guarantee compatibility
# with every upstream patch.
[tool.setuptools.dynamic]
version = {attr = "vllm_tt_plugin.__version__"}

# Linting aligned to upstream vLLM rules
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-logging-format
    "G",
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # zip without `strict=`
    "B905",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
]

[tool.ruff.format]
docstring-code-format = true
