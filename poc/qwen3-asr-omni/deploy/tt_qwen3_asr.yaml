# Qwen3-ASR-1.7B on one TT N150 as Omni stage 0, the `qwen3_asr` pipeline of
# vllm-omni#10609. Engine settings match the plain `vllm serve` bring-up (#319).
pipeline: qwen3_asr
model_runner: v1

stages:
  - stage_id: 0
    devices: "0"
    max_model_len: 2048
    max_num_seqs: 8
    block_size: 64
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1024
