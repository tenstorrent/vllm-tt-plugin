# The Qwen3-TTS talker alone on one TT device: codec frames out, no code2wav.
# Needs `register_tt_pipelines()` (vllm_tt_plugin.omni.pipelines) in the process
# that builds the Omni engine; smoke_talker.py does that.
pipeline: tt_qwen3_tts_talker
model_runner: v1
async_chunk: false

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    # The talker pads prompts to 32 positions and fills the padding: blocks of 32 or more.
    block_size: 64
    max_model_len: 2048
    max_num_batched_tokens: 2048
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    enforce_eager: true
    trust_remote_code: true
    # The talker captures its own step traces per request (90 MB, as its tests use),
    # and the clip encoders need the larger L1_SMALL region.
    additional_config:
      tt:
        trace_mode: none
        trace_region_size: 90000000
        l1_small_size: 65536
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 1024
      min_tokens: 2
      repetition_penalty: 1.05
