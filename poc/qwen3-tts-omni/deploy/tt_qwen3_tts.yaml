# Qwen3-TTS on TT: the talker on device 0 streams codec chunks to Code2Wav on
# device 1, which decodes them on that device.
#
# The TT generation stage needs the v1 runner with async_chunk: Omni's scheduler
# then receives the chunks, and the stage runner opens no connector.
model_runner: v1
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # The talker cuts chunks and Code2Wav joins them from these same values.
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      # Chunk sizes until the steady 25; the first entry replaces
      # initial_codec_chunk_frames. A frame takes ~62 ms to generate and plays for
      # 80 ms, so a chunk can be at most ~1.3x the one before it without the player
      # running dry. A jump from 1 frame straight to 25 needs ~1.9 s of buffering;
      # this ramp needs ~0.7 s.
      codec_chunk_ramp: [2, 2, 3, 4, 6, 8, 11, 15, 20, 25]

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    # The talker pads prompts to 32 positions and fills the padding: blocks of 32 or more.
    block_size: 64
    max_model_len: 2048
    max_num_batched_tokens: 2048
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    enforce_eager: true
    trust_remote_code: true
    output_connectors:
      to_stage_1: connector_of_shared_memory
    # The talker captures its own step traces per request (90 MB, as its tests use),
    # and the clip encoders need the larger L1_SMALL region.
    additional_config:
      tt:
        trace_mode: none
        trace_region_size: 90000000
        l1_small_size: 65536
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 1024
      min_tokens: 2
      repetition_penalty: 1.05

  - stage_id: 1
    devices: "1"
    max_num_seqs: 1
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    # A request's codes total 16 per frame, past the 32k default.
    max_num_batched_tokens: 65536
    max_model_len: 65536
    input_connectors:
      from_stage_0: connector_of_shared_memory
    # The codec's convolutions need the larger L1_SMALL region. Its traces, one per
    # decode length, fit the default trace region.
    additional_config:
      tt:
        l1_small_size: 65536
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0
