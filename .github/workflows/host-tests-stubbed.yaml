name: Host tests (stubbed ttnn)

# tests/host-stubs answers `import ttnn`, so this needs no tt-metal at all.
# Called by lint-and-host-tests.yaml (the required PR check) and by
# vllm-release-watch.yml (results on the pinned and the latest vLLM).

on:
  workflow_call:
    inputs:
      vllm-version:
        description: "vLLM version to install (blank: the pin in docs/install-vllm-tt.sh)"
        type: string
        default: ""
      python-versions:
        description: "JSON list of interpreters"
        type: string
        # The interpreters of tt-metal's Ubuntu 22.04 and 24.04 environments.
        default: '["3.10", "3.12"]'
      report:
        description: "Upload results as an artifact instead of failing on install or test errors"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  host-tests:
    name: host-tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      # Keeps vLLM's transitive torch ecosystem on CPU wheels, as in tt-metal.
      UV_TORCH_BACKEND: cpu
      VLLM: ${{ inputs.vllm-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve the torch pin of tt-metal's latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo tenstorrent/tt-metal --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName')
          pin=$(bash .github/scripts/tt-metal-torch-pin.sh "$tag")
          echo "TORCH_PIN=$pin" >> "$GITHUB_ENV"
          echo "stable=$tag torch-pin=$pin"

      - name: Point the install script at vLLM ${{ inputs.vllm-version }}
        if: inputs.vllm-version != ''
        run: |
          pinned=$(sed -nE 's/.*vllm==([^[:space:]]+).*/\1/p' docs/install-vllm-tt.sh | head -1)
          sed -i -E \
            -e "s#/v${pinned}/requirements/#/v${VLLM}/requirements/#" \
            -e "s#vllm==${pinned}([^0-9A-Za-z.]|\$)#vllm==${VLLM}\1#" \
            docs/install-vllm-tt.sh
          grep -Fq "/v${VLLM}/requirements/" docs/install-vllm-tt.sh
          grep -Fq "vllm==${VLLM}" docs/install-vllm-tt.sh

      - name: Create the environment
        run: uv venv --python ${{ matrix.python-version }} "$VIRTUAL_ENV"

      - name: Install torch at tt-metal's stable pin
        run: uv pip install "$TORCH_PIN"

      - name: Install vLLM, the plugin, and dev tools
        id: install
        # The operator install path, so this job also fails when it rots. In report
        # mode a failed install (e.g. an override clashing with new requirements) is a result.
        continue-on-error: ${{ inputs.report }}
        run: |
          source docs/install-vllm-tt.sh
          uv pip install -e ".[dev]"

      - name: Run host tests
        if: ${{ !inputs.report }}
        run: "$VIRTUAL_ENV/bin/python -m pytest tests/ --ignore=tests/tt"
        env:
          PYTHONPATH: tests/host-stubs

      - name: Run host tests, recording failures
        if: inputs.report && steps.install.outcome == 'success'
        env:
          PYTHONPATH: tests/host-stubs
        run: |
          "$VIRTUAL_ENV/bin/python" -m pytest tests/ --ignore=tests/tt -q -rfE --tb=no \
            -p no:cacheprovider --continue-on-collection-errors > pytest.log 2>&1 || true

      - name: Record the result
        if: always() && inputs.report
        env:
          INSTALL: ${{ steps.install.outcome }}
        run: |
          mkdir -p result
          echo "$INSTALL" > result/install
          if [ -f pytest.log ]; then
            cp pytest.log result/
            grep -E '^(FAILED|ERROR) ' pytest.log | sed -E 's/ - .*$//' | sort -u > result/failures || true
            grep -E ' in [0-9.]+s' pytest.log | tail -n 1 | tr -d '=' \
              | sed -E 's/^ +//; s/ in [0-9.]+s.*$//' > result/summary || true
          fi

      - uses: actions/upload-artifact@v4
        if: always() && inputs.report
        with:
          name: host-tests-${{ inputs.vllm-version }}-py${{ matrix.python-version }}
          path: result/
