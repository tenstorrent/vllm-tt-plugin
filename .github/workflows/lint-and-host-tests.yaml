name: Lint and host tests

# Host tests are the suite outside tests/tt, which drives a live server on a
# Tenstorrent device and runs from tt-metal's vllm-model-tests instead.

on:
  pull_request:
    branches: [main, "release/*"]
    # converted_to_draft starts an all-skipped run that cancels the in-flight one.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      tt-metal-tag:
        description: "tt-metal release tag for host-tests-ttnn (blank: latest stable and latest release)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: pre-commit/action@v3.0.1

  resolve-tt-metal:
    # Advisory: a bad newer or requested tag fails only host-tests-ttnn.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.resolve.outputs.tags }}
      torch-pins: ${{ steps.resolve.outputs.torch-pins }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Resolve the tags to test and their torch pins
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.tt-metal-tag }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            tags=$(jq -cn --arg t "$REQUESTED" '[$t]')
          else
            stable=$(gh release list --repo tenstorrent/tt-metal --exclude-drafts --exclude-pre-releases \
              --limit 1 --json tagName --jq '.[0].tagName')
            latest=$(gh release list --repo tenstorrent/tt-metal --exclude-drafts --limit 1 \
              --json tagName --jq '.[0].tagName')
            tags=$(jq -cn --arg s "$stable" --arg l "$latest" '[$s, $l] | unique')
          fi
          pins='{}'
          for tag in $(jq -r '.[]' <<<"$tags"); do
            pin=$(bash .github/scripts/tt-metal-torch-pin.sh "$tag")
            pins=$(jq -c --arg t "$tag" --arg p "$pin" '. + {($t): $p}' <<<"$pins")
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "torch-pins=$pins" >> "$GITHUB_OUTPUT"
          echo "tags=$tags torch-pins=$pins"

  host-tests-stubbed:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/host-tests-stubbed.yaml

  host-tests-ttnn:
    # Release images are the only public ttnn for every tag: the release .debs
    # carry no Python package, and PyPI gets tagged releases only.
    name: host-tests-ttnn (${{ matrix.tt-metal-tag }}, ubuntu-${{ matrix.ubuntu }})
    needs: resolve-tt-metal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tt-metal-tag: ${{ fromJSON(needs.resolve-tt-metal.outputs.tags) }}
        # The images ship Python 3.10 and 3.12 respectively, in /opt/venv.
        ubuntu: ["22.04", "24.04"]
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium-ubuntu-${{ matrix.ubuntu }}-release-amd64:${{ matrix.tt-metal-tag }}
    defaults:
      run:
        shell: bash
    env:
      UV_TORCH_BACKEND: cpu
      TORCH_PIN: ${{ fromJSON(needs.resolve-tt-metal.outputs.torch-pins)[matrix.tt-metal-tag] }}
    steps:
      - uses: actions/checkout@v4

      - name: Install torch at this tag's pin
        run: uv pip install "$TORCH_PIN"

      - name: Install vLLM and the plugin
        run: source docs/install-vllm-tt.sh

      - name: Install dev tools
        run: uv pip install -e ".[dev]"

      - name: Run host tests
        run: "$VIRTUAL_ENV/bin/python -m pytest tests/ --ignore=tests/tt"

  required-checks:
    # The only check the branch ruleset should require. host-tests-ttnn is left
    # out so a slow or failed real-ttnn leg can never hold up a merge.
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [pre-commit, host-tests-stubbed]
    runs-on: ubuntu-latest
    steps:
      - name: Gate on pre-commit and stubbed host tests
        env:
          PRE_COMMIT: ${{ needs.pre-commit.result }}
          STUBBED: ${{ needs.host-tests-stubbed.result }}
        run: |
          if [ "$PRE_COMMIT" != success ] || [ "$STUBBED" != success ]; then
            echo "::error::pre-commit is '$PRE_COMMIT', host-tests-stubbed is '$STUBBED'"
            exit 1
          fi
